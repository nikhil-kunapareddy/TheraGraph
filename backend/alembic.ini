# Alembic configuration.
#
# The database URL is NOT stored here: it comes from the application settings at
# runtime (see alembic/env.py), so migrations always target the same database the
# application is configured for and no credential lands in version control.

[alembic]
# %(here)s is the directory holding this file. Without it these resolve against the
# process cwd, so `alembic` would only work when run from backend/ -- and a relative
# sqlite URL would then mean a different file than it does from the repo root.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
version_path_separator = os
# Migration files are named <rev>_<slug>.py with a date prefix, so `ls` shows history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
