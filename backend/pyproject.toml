[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theragraph"
version = "0.1.0"
description = "TheraGraph - an evidence-grounded computational drug-discovery workbench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Nikhil Kunapareddy" }]

dependencies = [
  # web / api
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  # NoDecode (config.py) arrived in 2.7.
  "pydantic-settings>=2.7",
  "orjson>=3.10",
  "python-multipart>=0.0.9",
  # persistence
  "SQLAlchemy[asyncio]>=2.0.30",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "greenlet>=3.0",
  # cache / queue
  "redis>=5.0",
  # http clients / resilience
  "httpx>=0.27",
  "tenacity>=8.5",
  # observability
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-api>=1.26",
  "opentelemetry-exporter-otlp-proto-http>=1.26",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.47b0",
  "opentelemetry-instrumentation-httpx>=0.47b0",
  # science / ml
  "rdkit>=2024.3.1",
  "numpy>=1.24,<2.5",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "torch>=2.2",
  "joblib>=1.4",
  # agent
  "anthropic>=0.34",
  "mcp>=1.2",
  "jinja2>=3.1",
  # security / infra
  "pyjwt>=2.9",
  "passlib[bcrypt]>=1.7.4",
  "boto3>=1.34",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/nikhil-kunapareddy/TheraGraph"
Documentation = "https://github.com/nikhil-kunapareddy/TheraGraph/tree/main/docs"
Issues = "https://github.com/nikhil-kunapareddy/TheraGraph/issues"
Security = "https://github.com/nikhil-kunapareddy/TheraGraph/security/policy"

[project.optional-dependencies]
xgb = [
  # ``xgboost-cpu`` is the same library without the CUDA runtime: the Linux wheel of
  # plain ``xgboost`` hard-depends on nvidia-nccl (~250 MB) that a CPU deployment
  # never loads. macOS ships only the CPU build under the original name.
  "xgboost>=2.0; sys_platform != 'linux'",
  "xgboost-cpu>=2.0; sys_platform == 'linux'",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "fakeredis>=2.23",
  "freezegun>=1.5",
  # ruff and mypy are pinned to a minor series, not just a floor. A formatter is a CI
  # gate: an unpinned `ruff format --check` starts failing the day upstream changes its
  # mind about a line break, on a commit that touched nothing.
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<3.0",
  "types-requests",
]

[project.scripts]
theragraph = "theragraph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/theragraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires external services (postgres/redis)",
  "slow: long running (model training)",
  "e2e: full workflow through the API",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "T20"]
ignore = ["B008", "N818", "RUF012", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "ASYNC240"]
"src/theragraph/cli.py" = ["T20"]
"src/theragraph/ml/train.py" = ["T20"]
# Markdown/Jinja report templates: a wrapped line renders as a different document.
"src/theragraph/services/reports.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["theragraph"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["theragraph.ml.*"]
disallow_untyped_defs = true
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
# RDKit registers most of Descriptors/Crippen/Lipinski/AllChem at import time, so no
# static checker can see those names. Every RDKit call this package makes is asserted
# against a known molecule in tests/unit/test_chem.py, which is what actually catches
# a misspelled descriptor.
module = ["theragraph.chem.*"]
disallow_untyped_defs = true
disable_error_code = ["attr-defined", "no-any-return"]
