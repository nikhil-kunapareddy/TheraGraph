# Serves the built SPA and proxies the API.
#
# Listens on 8080 so the container can run as an unprivileged user.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API host is resolved at request time so the backend can restart independently.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream "http://api:8000";

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are immutable; index.html must never be cached or a deploy
    # would keep serving the previous bundle's asset references.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Research runs and training submissions can take a while to respond.
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location = /healthz {
        proxy_pass $api_upstream;
        access_log off;
    }

    location = /openapi.json { proxy_pass $api_upstream; }
    location /docs { proxy_pass $api_upstream; }

    # Metrics are internal: never expose them through the public frontend.
    location = /metrics { return 404; }

    # Client-side routing: unknown paths render the SPA rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
