# Response headers for every location.
#
# nginx does not inherit add_header from the server block into a location that sets its
# own add_header, so this file is included in each such location as well as at server
# level. Keep it the single place these headers are defined.
#
# CSP: the SPA is same-origin with its API (/api/ is proxied below). The Inter stylesheet
# and fonts are the only third-party resources. Recharts sets inline style attributes,
# hence 'unsafe-inline' for styles only; scripts stay 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://rsms.me; font-src 'self' https://rsms.me data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
